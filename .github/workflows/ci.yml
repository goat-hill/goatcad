name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # `defaults.run.working-directory` does not apply to actions, only to
          # `run` steps, so the lockfile has to be named from the repo root.
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # The marketing site (web/) is a self-contained npm project outside the
  # Electron build, so it gets its own job rather than more steps above.
  # It runs unconditionally: GitHub Actions has no job-level `paths` filter, and
  # a ~40s job is not worth a filter action as a dependency.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # web/ relies on `astro check` rather than ESLint for type safety
      # (see docs/WEB.md).
      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
