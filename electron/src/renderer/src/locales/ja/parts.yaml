setup:
  title: 販売代理店に接続
  body: DigiKey または Mouser で実在のメーカー部品を検索できます — 価格、在庫、データシート、CAD モデルへのリンク。販売代理店の無料 API キーが必要で、取得には数分かかります。
  action: 販売代理店を設定
providers:
  digikey:
    steps:
      - DigiKey の開発者ポータルにサインインし、Production アプリを追加します — Sandbox アプリは別のサーバーを使うため不可です。
      - 製品リストで Product Information V4 にチェックを入れます。GoatCAD が使うのはそれだけです。
      - OAuth Callback は空欄のままにします。これは 3-legged OAuth にのみ使われ、GoatCAD では使用しません。
      - アプリの Client ID と Client Secret を下の欄にコピーします。
  mouser:
    steps:
      - Mouser の API ハブにサインインします。
      - Search API のキーをリクエストします。Mouser からメールでキーが送られます。
      - 下の欄にキーを貼り付けます。
