collision:
  title: ルーター
  buttonTitle: ルーター モード
  explain:
    highlight: すべてをそのままにしてクリアランス違反を表示しますが、DRC 違反を許容しない限り配置はしません。
  settingsTitle: 設定
  settings:
    allowViolations:
      name: DRC違反を許容する
      note: ハイライトで表示されるクリアランス違反があっても配線を配置します。
    freeAngle:
      name: 自由角度モード
      note: 配線を任意の角度でカーソルまでまっすぐ引きます。
    shoveVias:
      name: ビアの押しのけ
    jumpOverObstacles:
      name: 障害物を迂回
      note: 押しのけた配線がパッドに当たったとき、配線を止めずにパッドの向こう側へ回り込みます。
    removeLoops:
      name: 余分な配線を削除
      note: 既存の配線と同じ接続をする新しい配線が、既存の配線を置き換えます。
    smartPads:
      name: パッド接続を最適化
      note: 配線はパッドの最もきれいな方向から出入りし、不自然な角度にはなりません。
    smoothDragged:
      name: セグメントをスムーズに移動
      note: ドラッグしたセグメントは隣接セグメントと一直線にそろい、コーナーはその交点に吸着します。
    optimizeDragged:
      name: ドラッグした配線全体を最適化
      note: ドラッグで動いた部分だけでなく、ドラッグした配線全体を整えます。
    autoPosture:
      name: マウスの軌跡を利用して配線の姿勢を設定
      note: 配線を斜めから始めるか直線から始めるかを、クリック後のマウスの動きで決めます。
    startDiagonal:
      name: 斜めから開始
      note: マウスの軌跡を使わない場合、配線は斜めから始まります。/ で切り替えます。
    fixAllSegments:
      name: クリック時にすべての配線セグメントを固定する
      note: クリックするとカーソルまでの配線全体を確定します。オフにすると最後のセグメントは未確定のままです。
