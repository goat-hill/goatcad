exclusions:
  note: KiCad のチェックで除外された検出結果を、プロジェクトファイルから読み込んで表示しています。GoatCAD は各除外を、KiCad がマーカーを描いた位置ではなく、ルールと対象アイテムで照合します。そのため、アイテムを移動しても除外はここで有効なままです（KiCad では検出結果が再び表示されます）。除外の追加と削除は KiCad で行います。
  none: このプロジェクトには除外がありません。
  matched: '{count} 件の検出を除外'
  unmatched: 一致する検出なし
  unmatchedHint: 現在 GoatCAD が検出する結果の中に、この検出結果はありません。修正済みか、対象アイテムが削除されたか、GoatCAD が KiCad と異なる名前でアイテムを識別しています。
  noItems: 照合不可
  noItemsHint: この除外は位置だけを指定しており、対象のアイテムを指定していないため、GoatCAD はどの検出結果を指すのか判断できません。
