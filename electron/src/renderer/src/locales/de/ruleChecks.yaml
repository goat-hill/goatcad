exclusions:
  note: Dies sind die in den Prüfungen von KiCad ausgeschlossenen Befunde, gelesen aus der Projektdatei. GoatCAD ordnet jeden über seine Regel und die genannten Elemente zu, nicht über die Stelle, an der KiCad seine Markierung gezeichnet hat. Ein Ausschluss gilt hier also weiter, nachdem seine Elemente verschoben wurden — in KiCad käme der Befund zurück. Ausschlüsse werden in KiCad hinzugefügt und entfernt.
  none: Das Projekt hat keine Ausschlüsse.
  matched: 'Schließt {count} Befund aus | Schließt {count} Befunde aus'
  unmatched: Passt zu keinem Befund
  unmatchedHint: Nichts, was GoatCAD jetzt findet, ist dieser Befund — er wurde behoben, seine Elemente sind entfernt, oder GoatCAD benennt seine Elemente anders als KiCad.
  noItems: Nicht zuordenbar
  noItemsHint: Dieser Ausschluss nennt nur eine Position, nicht die Elemente, um die es geht, daher kann GoatCAD nicht erkennen, welchen Befund er meint.
