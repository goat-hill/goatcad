collision:
  title: Router
  buttonTitle: Routermodus
  explain:
    highlight: Lässt alles an seinem Platz und markiert Abstandsverletzungen, setzt sie aber nur, wenn DRC-Verletzungen zugelassen sind.
  settingsTitle: Einstellungen
  settings:
    allowViolations:
      name: DRC-Verletzungen zulassen
      note: Setzt die Leiterbahn auch durch die Abstandsverletzungen, die Hervorheben markiert.
    freeAngle:
      name: Freier Winkel
      note: Leiterbahnen laufen in beliebigem Winkel gerade zum Cursor.
    shoveVias:
      name: DuKos schieben
    jumpOverObstacles:
      name: Hindernisse überspringen
      note: Geschobene Leiterbahnen, die auf ein Pad treffen, laufen um es herum dahinter weiter, statt die Route aufzuhalten.
    removeLoops:
      name: Redundante Leiterbahnen entfernen
      note: Eine neue Leiterbahn, die verbindet, was eine alte schon verbindet, ersetzt diese.
    smartPads:
      name: Pad-Anschlüsse optimieren
      note: Leiterbahnen verlassen und erreichen Pads auf dem saubersten Weg, nie in einem schiefen Winkel.
    smoothDragged:
      name: Gezogene Segmente glätten
      note: Ein gezogenes Segment rastet in die Linie seiner Nachbarn ein, eine Ecke auf deren Schnittpunkt.
    optimizeDragged:
      name: Ganze gezogene Leiterbahn optimieren
      note: Die ganze gezogene Leiterbahn wird aufgeräumt, nicht nur der bewegte Teil.
    autoPosture:
      name: Mausweg bestimmt die Eckenlage
      note: Ob eine Leiterbahn diagonal oder gerade beginnt, folgt daraus, wie die Maus den Klickpunkt verlässt.
    startDiagonal:
      name: Diagonal beginnen
      note: Ohne Mausweg beginnen Leiterbahnen mit der Diagonale; / kehrt das um.
    fixAllSegments:
      name: Alle Segmente beim Klicken fixieren
      note: Ein Klick legt die ganze Leiterbahn bis zum Cursor. Aus, bleibt das letzte Segment frei.
