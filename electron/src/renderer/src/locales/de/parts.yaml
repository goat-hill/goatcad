setup:
  title: Distributor verbinden
  body: DigiKey oder Mouser nach echten Herstellerbauteilen durchsuchen — Preise, Lagerbestand,
    Datenblätter und Links zu CAD-Modellen. Dafür ist ein kostenloser API-Schlüssel des
    Distributors nötig, den Sie in wenigen Minuten erhalten.
  action: Distributor einrichten

providers:
  digikey:
    steps:
      - Melden Sie sich im Entwicklerportal von DigiKey an und legen Sie eine Production-App an —
        keine Sandbox-App, die einen anderen Server verwendet.
      - Wählen Sie in der Produktliste Product Information V4 aus. GoatCAD verwendet nur diese.
      - Lassen Sie OAuth Callback leer. Das Feld gilt nur für Three-Legged OAuth, das GoatCAD
        nicht verwendet.
      - Kopieren Sie die Client ID und das Client Secret der App in die Felder unten.
  mouser:
    steps:
      - Melden Sie sich im API-Hub von Mouser an.
      - Beantragen Sie einen Schlüssel für die Search API. Mouser schickt ihn Ihnen per E-Mail.
      - Fügen Sie den Schlüssel in das Feld unten ein.

