setup:
  title: Connecter un distributeur
  body: Recherchez de vraies pièces de fabricants chez DigiKey ou Mouser — prix, stock, fiches techniques et liens vers les modèles CAO. Il faut une clé API gratuite du distributeur, qui s’obtient en quelques minutes.
  action: Configurer un distributeur
providers:
  digikey:
    steps:
      - Connectez-vous au portail développeur de DigiKey et ajoutez une application Production — pas Sandbox, qui utilise un autre serveur.
      - Cochez Product Information V4 dans la liste des produits. GoatCAD n’utilise que celui-ci.
      - Laissez OAuth Callback vide. Il ne s’applique qu’à l’OAuth à trois étapes, que GoatCAD n’utilise pas.
      - Copiez le Client ID et le Client Secret de l’application dans les champs ci-dessous.
  mouser:
    steps:
      - Connectez-vous au hub API de Mouser.
      - Demandez une clé pour la Search API. Mouser vous l’envoie par e-mail.
      - Collez la clé dans le champ ci-dessous.
