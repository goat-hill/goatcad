collision:
  title: Routeur
  buttonTitle: Mode du routeur
  explain:
    highlight: Laisse tout en place et signale les violations d'isolation, mais ne les place pas tant que les violations de DRC ne sont pas autorisées.
  settingsTitle: Réglages
  settings:
    allowViolations:
      name: Autoriser les violations de DRC
      note: Place la piste même à travers les violations d'isolation que Surligner signale.
    freeAngle:
      name: Mode angle libre
      note: Les pistes vont droit vers le curseur, à n'importe quel angle.
    shoveVias:
      name: Pousser les vias
    jumpOverObstacles:
      name: Sauter les obstacles
      note: Les pistes poussées qui rencontrent un pad le contournent par derrière, au lieu de bloquer le routage.
    removeLoops:
      name: Supprimer les pistes redondantes
      note: Une nouvelle piste qui relie ce qu'une ancienne relie déjà la remplace.
    smartPads:
      name: Optimiser les connexions aux pads
      note: Les pistes sortent des pads et y entrent par leur sortie la plus propre, jamais selon un angle bizarre.
    smoothDragged:
      name: Lisser les segments glissés
      note: Un segment glissé s'aligne sur ses voisins, et un coin sur leur intersection.
    optimizeDragged:
      name: Optimiser toute la piste glissée
      note: Toute la piste glissée est nettoyée, pas seulement la partie déplacée.
    autoPosture:
      name: Utiliser le chemin de la souris pour la posture
      note: Une piste commence en diagonale ou droite selon la façon dont la souris quitte le clic.
    startDiagonal:
      name: Commencer en diagonale
      note: Sans le chemin de la souris, les pistes commencent par la diagonale ; / l'inverse.
    fixAllSegments:
      name: Fixer tous les segments au clic
      note: Un clic pose toute la piste jusqu'au curseur. Désactivé, le dernier segment reste libre.
