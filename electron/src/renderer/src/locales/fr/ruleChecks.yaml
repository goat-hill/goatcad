exclusions:
  note: Voici les constats exclus dans les contrôles de KiCad, lus depuis le fichier projet. GoatCAD associe chacun à sa règle et aux éléments qu'il nomme, et non à l'endroit où KiCad a dessiné son marqueur ; une exclusion reste donc valable ici après le déplacement de ses éléments, alors que dans KiCad le constat réapparaîtrait. Les exclusions s'ajoutent et se retirent dans KiCad.
  none: Le projet n'a aucune exclusion.
  matched: 'Exclut {count} constat | Exclut {count} de constats | Exclut {count} constats'
  unmatched: Ne correspond à aucun constat
  unmatchedHint: Rien de ce que GoatCAD trouve actuellement ne correspond à ce constat — il a été corrigé, ses éléments ont disparu, ou GoatCAD nomme ses éléments autrement que KiCad.
  noItems: Association impossible
  noItemsHint: Cette exclusion ne nomme qu'une position, pas les éléments qu'elle concerne ; GoatCAD ne peut donc pas savoir de quel constat il s'agit.
