collision:
  title: 布线器
  buttonTitle: 布线器模式
  explain:
    highlight: 保持所有对象不动并标记间距违规，但除非允许 DRC 违规，否则不会放置。
  settingsTitle: 设置
  settings:
    allowViolations:
      name: 允许违反 DRC 规则
      note: 即使穿过“高亮”所标记的间距违规，也照样放置走线。
    freeAngle:
      name: 自由角度模式
      note: 走线以任意角度直接连到光标。
    shoveVias:
      name: 推挤过孔
    jumpOverObstacles:
      name: 绕过障碍物
      note: 被推挤的走线遇到焊盘时会绕到其后方，而不是阻挡布线。
    removeLoops:
      name: 移除冗余走线
      note: 新走线连接了旧走线已连接的对象时，将替换旧走线。
    smartPads:
      name: 优化焊盘连接
      note: 走线以最整洁的出口进出焊盘，绝不以奇怪的角度。
    smoothDragged:
      name: 平滑拖动线段
      note: 被拖动的线段会与相邻线段对齐，拐角会落在它们的交点上。
    optimizeDragged:
      name: 优化整条拖动的走线
      note: 整理整条被拖动的走线，而不仅是拖动移动的部分。
    autoPosture:
      name: 使用鼠标路径设置走线形态
      note: 走线以斜线还是直线开始，取决于鼠标离开点击处的方向。
    startDiagonal:
      name: 以斜线开始
      note: 不使用鼠标路径时，走线以斜线开始；按 / 切换。
    fixAllSegments:
      name: 点击时固定所有线段
      note: 点击会将整条走线固定到光标处。关闭时，最后一段保持自由。
