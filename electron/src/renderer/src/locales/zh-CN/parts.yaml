setup:
  title: 连接分销商
  body: 在 DigiKey 或 Mouser 上搜索真实的制造商元件——价格、库存、数据手册和 CAD 模型链接。需要从分销商处获取免费的 API 密钥，只需几分钟。
  action: 设置分销商
providers:
  digikey:
    steps:
      - 登录 DigiKey 开发者门户并添加一个 Production 应用——不要用 Sandbox 应用，它使用的是另一台服务器。
      - 在产品列表中勾选 Product Information V4。GoatCAD 只使用这一项。
      - 将 OAuth Callback 留空。它只适用于三方 OAuth，而 GoatCAD 并不使用。
      - 将应用的 Client ID 和 Client Secret 复制到下面的输入框中。
  mouser:
    steps:
      - 登录 Mouser 的 API 中心。
      - 申请 Search API 的密钥。Mouser 会通过电子邮件发送给你。
      - 将密钥粘贴到下面的输入框中。
