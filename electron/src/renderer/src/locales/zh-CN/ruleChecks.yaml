exclusions:
  note: 这些是在 KiCad 检查中被排除的问题，读取自项目文件。GoatCAD 按规则及其指明的项目来匹配每个排除项，而不是按 KiCad 绘制标记的位置，因此项目移动后排除项在这里仍然有效——而在 KiCad 中该问题会重新出现。排除项需在 KiCad 中添加和移除。
  none: 此项目没有排除项。
  matched: '排除 {count} 个问题'
  unmatched: 未匹配任何问题
  unmatchedHint: GoatCAD 当前发现的问题中没有与之对应的——它已被修复、其项目已不存在，或 GoatCAD 对其项目的命名与 KiCad 不同。
  noItems: 无法匹配
  noItemsHint: 此排除项只指明了一个位置，没有指明相关项目，因此 GoatCAD 无法判断它对应哪个问题。
