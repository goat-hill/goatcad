# The title bar's Edit menu.
edit:
  cut: Cut
  copy: Copy
  paste: Paste
  duplicate: Duplicate
  delete: Delete
  rotate: Rotate counterclockwise
  rotateClockwise: Rotate clockwise
  flip: Change side
  fanout: Fanout…
  # Canvas menu only: split the right-clicked track there, and move the
  # selected tracks one copper layer up or down the stack.
  breakTrack: Break track
  trackLayerNext: Move to next layer
  trackLayerPrev: Move to previous layer
# Toolbar chips and tool-search rows that are not drawing tools.
tools:
  # KiCad's Flip: the selected footprints move to the other side of the board,
  # front layers swapped for back.
  flip: Change side
  # Altium's Fanout / Allegro's Create Fanout, in the tool search: opens the
  # overlay where each pad of the selected footprint gets a via.
  fanout: Fanout…
# The Fanout overlay (top right of the canvas).
fanout:
  title: Fanout
  style: Style
  direction: Direction
  surfaceRows: Surface rows
  surfaceRowsHint: A grid's outer rows left for routing on the surface, with no via
  styles:
    auto: Auto
    # A via between four balls, reached by a short diagonal track.
    dogbone: Dogbone
    # The via in the pad itself (via-in-pad).
    under-pads: Under pads
    inline: Inline rows
    staggered: Staggered rows
  directions:
    out: Outward
    in: Inward
    ne: North-east
    se: South-east
    sw: South-west
    nw: North-west
  willPlace: Will place 1 via | Will place {count} vias
  placed: Placed 1 via | Placed {count} vias
  # {reason} is one of skip.*, e.g. "50 skipped: no-connect".
  skipped: '{count} skipped: {reason}'
  surface: 1 left for the surface | {count} left for the surface
  refused: 1 pad can't take a via | {count} pads can't take a via
  skip:
    no-net: no net
    no-connect: no-connect
    through-hole: through-hole
    # The pad's copper already joins the rest of its net: no airwire leaves it.
    joined: already joined to its net
    # The pad's copper already reaches a via (a fanout run before, or a route).
    via: already has a via
  apply: Fan out
# Selection verbs without a toolbar chip, found through the tool search (and
# their keys: L, U, Shift+Del). "Connection": the copper joined to what is
# selected; each Select connection widens it (to a junction, a pad, all of it).
selection:
  toggleLock: Lock / unlock
  selectConnection: Select connection
  selectNet: Select net
  deleteFullTrack: Delete full track
# The board's two user origins, as tool-search rows. The grid origin is where the
# grid is measured from; the drill origin (KiCad's "drill / place file origin")
# is the point drill and component-position files can be written relative to.
origins:
  placeGrid: Grid origin
  resetGrid: Reset grid origin
  placeDrill: Drill / place file origin
  resetDrill: Reset drill / place file origin
# Centered overlay over the board tab while it loads (rendered by EditorArea):
# one bar spanning file read, parse, and first render; {percent} is 0-100.
loadingBoard: 'Loading board… {percent}%'
# The left view rail: display toggles over the canvas (KiCad's left toolbar).
# Sketch = outline-only rendering, for seeing through dense copper.
viewRail:
  # The rail's toggles: each is the chip's tooltip and its tool-search name.
  zoneOutlines: Zone outlines only
  sketchTracks: Sketch tracks
  sketchVias: Sketch vias
  hideRatsnest: Hide ratsnest
  # The shade over the area inside a closed board outline (Edge.Cuts).
  boardArea: Board area tint
  flip: Flip board
  # KiCad's footprint-text switches: a footprint's Reference, its Value, and its
  # other fields and texts, each drawn and clickable while on.
  fpReferences: Footprint references
  fpValues: Footprint values
  fpText: Footprint text
  # Component bodies registered over the layout. The complete physical board
  # remains the job of the neighboring 3D Preview mode.
  assembly: Assembly overlay
parseError:
  title: Could not parse board file
# The collision pill in the board's corner, beside Grid and Filter: how a
# route or a track drag meets other copper. The pill itself reads the mode's
# name (viewport.routeModes).
collision:
  # Menu heading. Rendered upper-case by the popover chrome.
  title: Router
  # Hover text on the viewport pill, in every state: its name alone (DESIGN.md §Viewport status strips).
  buttonTitle: Router mode
  # Hover text on the router menu's mode whose name does not say what it does.
  explain:
    highlight: Leaves everything in place and marks clearance violations, but won't place them unless DRC violations are allowed.
  # The router's switches: KiCad's Interactive Router Settings. Push's own sit
  # under Push, Highlight's under Highlight, the rest below the modes; each
  # note is the switch's hover text.
  settingsTitle: Settings
  settings:
    allowViolations:
      name: Allow DRC violations
      note: Places the track even through the clearance violations Highlight marks.
    freeAngle:
      name: Free angle mode
      note: Tracks run straight to the cursor at any angle.
    shoveVias:
      name: Push vias
    jumpOverObstacles:
      name: Jump over obstacles
      note: Pushed tracks that meet a pad go on round it, behind it, instead of holding the route back.
    removeLoops:
      name: Remove redundant tracks
      note: A new track that joins what an old one already joins replaces it.
    smartPads:
      name: Optimize pad connections
      note: Tracks leave and enter pads by their cleanest exit, never at an odd angle.
    smoothDragged:
      name: Smooth dragged segments
      note: A dragged segment snaps into line with its neighbors, and a corner onto where they meet.
    optimizeDragged:
      name: Optimize entire dragged track
      note: The whole dragged track is tidied, not only the part the drag moved.
    autoPosture:
      name: Use mouse path to set posture
      note: Whether a track starts diagonal or straight follows how the mouse leaves the click.
    startDiagonal:
      name: Start diagonal
      note: Without the mouse path, tracks start with the diagonal; / flips it.
    fixAllSegments:
      name: Fix all segments on click
      note: A click lays the whole track to the cursor. Off, the last segment stays free.
