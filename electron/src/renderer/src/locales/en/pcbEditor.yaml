# Chrome for the board as a physical object — shared by the PCB editor's 3D
# mode and the footprint editor's 3D pane. Toolbar titles are hover tooltips.
viewport3d:
  # Camera preset not shared with the model viewer: looking up at the underside.
  bottomViewTitle: Bottom view
  # Tessellating the board's layers; brief, but not instant on a large design.
  # {percent} is 0–100 through the build; the board appears under it as the
  # stages complete.
  building: 'Building board… {percent}%'
  # Label over the component-model progress bar. {settled} of {total} have
  # finished loading — counting the ones that failed, which are also done.
  loadingModels: 'Loading models… {settled} of {total}'
  # Heading of a failed-model notice's hover tooltip, above the failing links.
  missingModelsDetail: 'Could not resolve:'
  options:
    # Title of the right-rail panel holding the switches.
    layersGroup: Layers
    # One per switch. "Board body" is the bare substrate the layers sit on.
    boardBody: Board body
    copper: Copper
    solderMask: Solder mask
    solderPaste: Solder paste
    silkscreen: Silkscreen
    holes: Plated holes
    # The KiCad user layers carrying notes and dimensions, not board material.
    drawings: Comments & drawings
    axes: Axes
    # The dimension gauge drawn around the board — rails, ticks and sizes.
    gauge: Scale gauge
    # Master switch over the four class filters under it.
    models: Component models
    modelsThroughHole: Through-hole
    modelsSmd: SMD
    # Parts whose footprint declares neither through-hole nor SMD.
    modelsUnspecified: Unspecified
    # "Do not populate" — marked in the design as not fitted on the assembly.
    modelsDnp: DNP
    # Footprints the pick-and-place file skips: mounting holes, fiducials,
    # logos. Nothing is assembled at these positions.
    modelsNotInPosFiles: Not in position files
    reset: Reset to defaults
  # How the pane presents the board: the right rail's second section, a
  # property table. An exported image carries all three.
  presentation:
    title: Presentation
    projection: Projection
    projections:
      perspective: Perspective
      # Parallel lines stay parallel; one scale across the picture.
      orthographic: Orthographic
    lighting: Lighting
    lightings:
      # The default: a raked key light with soft fill.
      studio: Studio
      # No key light; even, shadowless.
      soft: Soft
      # Every face lit alike; colors exactly as named.
      flat: Flat
      # A hard key and deep shadows.
      dramatic: Dramatic
    # A percent of the preset's light as tuned: 100 is the preset, 200 twice as bright.
    lightLevel: Light level
    # What the pane draws behind the board.
    background: Background
    backgrounds:
      # The app's own dark or light ground.
      theme: Theme
      # Shown as a checkerboard; exported with alpha.
      transparent: Transparent
      white: White
      black: Black
  # The 3D view as a PNG: the rail's Export section, the File ▸ Export row and the dialog.
