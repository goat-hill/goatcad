# An AI agent's viewport on a board or schematic canvas: a dashed box round
# where the agent is working, labeled with the agent's own text.
agentViewport:
  # The × on the box's label, and its tooltip: takes the box away and ends any
  # routing the agent is doing in it, landing nothing.
  close: Close the agent's viewport
  # A marker at the canvas edge, pointing toward a box out of view; clicking it
  # moves the view to the box. {label} is the box's label.
  reveal: "Show the agent's viewport: {label}"
