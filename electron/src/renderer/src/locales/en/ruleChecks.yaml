# Board Setup's Design Rules and Schematic Setup's Electrical Rules
# (shared/RuleSeverityTable.vue): every rule KiCad's DRC and ERC name, with
# this project's severity for it and whether GoatCAD checks it yet.
# A rule's severity, a three-way segmented control; Ignore turns the rule off.
severity:
  error: Error
  warning: Warning
  ignore: Ignore
# The chip beside a rule GoatCAD checks, once the checks have run.
# passing: nothing reported now.
status:
  passing: Passing
  findings: '{count} finding | {count} findings'
# Tooltip on the warning glyph beside a rule not checked yet. Its severity is
# still saved to the project.
notSupported: Not yet supported
# Shown beside a rule whose severity differs from its default; {severity} is one of severity.*.
defaultSeverity: 'Default: {severity}'
# Button beside defaultSeverity: sets the rule back to its default severity.
restore: Restore
# KiCad's own group headings, in its Violation Severity pages.
drcGroups:
  electrical: Electrical
  dfm: Design for Manufacturing
  schematicParity: Schematic Parity
  signalIntegrity: Signal Integrity
  readability: Readability
  misc: Miscellaneous
ercGroups:
  connections: Connections
  conflicts: Conflicts
  misc: Miscellaneous
