# The Exclusions section of Board Setup and Schematic Setup
# (shared/ExclusionList.vue): the findings a KiCad user excluded, read from the
# project file.
exclusions:
  note: These are the findings excluded in KiCad's checks, read from the project file. GoatCAD matches each one by its rule and the items it names, not by where KiCad drew its marker, so an exclusion still holds here after its items move — in KiCad the finding would come back. Exclusions are added and removed in KiCad.
  none: The project has no exclusions.
  # {count} findings it excludes here now.
  matched: 'Excludes {count} finding | Excludes {count} findings'
  unmatched: Matches no finding
  unmatchedHint: Nothing GoatCAD finds now is this finding — it was fixed, its items are gone, or GoatCAD names its items differently from KiCad.
  noItems: Cannot match
  noItemsHint: This exclusion names only a position, not the items it is about, so GoatCAD cannot tell which finding it means.
