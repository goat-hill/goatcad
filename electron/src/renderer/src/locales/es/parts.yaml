setup:
  title: Conecte un distribuidor
  body: Busque en DigiKey o Mouser componentes reales de fabricantes, con precios, existencias,
    hojas de datos y enlaces a modelos CAD. Necesita una clave de API gratuita del distribuidor,
    que se obtiene en unos minutos.
  action: Configurar un distribuidor
providers:
  digikey:
    steps:
      - Inicie sesión en el portal para desarrolladores de DigiKey y añada una aplicación de
        producción (Production), no de pruebas (Sandbox), que usa otro servidor.
      - Marque Product Information V4 en la lista de productos. GoatCAD solo usa ese.
      - Deje vacío OAuth Callback. Solo se aplica a OAuth de tres pasos, que GoatCAD no usa.
      - Copie el Client ID y el Client Secret de la aplicación en los campos de abajo.
  mouser:
    steps:
      - Inicie sesión en el API hub de Mouser.
      - Solicite una clave para la Search API. Mouser se la envía por correo electrónico.
      - Pegue la clave en el campo de abajo.
