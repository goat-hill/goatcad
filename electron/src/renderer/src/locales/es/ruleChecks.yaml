exclusions:
  note: Son los hallazgos excluidos en las comprobaciones de KiCad, leídos del archivo de proyecto. GoatCAD hace coincidir cada uno por su regla y los elementos que nombra, no por dónde dibujó KiCad su marcador, así que una exclusión se mantiene aquí aunque sus elementos se muevan; en KiCad el hallazgo volvería a aparecer. Las exclusiones se añaden y eliminan en KiCad.
  none: El proyecto no tiene exclusiones.
  matched: 'Excluye {count} hallazgo | Excluye {count} hallazgos | Excluye {count} hallazgos'
  unmatched: No coincide con ningún hallazgo
  unmatchedHint: Nada de lo que encuentra GoatCAD ahora corresponde a este hallazgo; se corrigió, sus elementos ya no existen o GoatCAD nombra sus elementos de forma distinta a KiCad.
  noItems: No se puede asociar
  noItemsHint: Esta exclusión solo indica una posición, no los elementos a los que se refiere, así que GoatCAD no puede saber a qué hallazgo corresponde.
