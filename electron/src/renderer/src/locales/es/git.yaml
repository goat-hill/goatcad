error:
  noRemote: No hay ningún remoto configurado. Añada uno con git remote add.
  noUpstream: La rama no tiene upstream. Haga push para publicarla.
  auth: Git no pudo autenticarse en el remoto. Configure una clave SSH o un asistente de credenciales y vuelva a intentarlo.
  diverged: La rama y el remoto han cambiado los dos. Fusione o haga rebase en un terminal y vuelva a intentarlo.
  rejected: El remoto tiene commits que usted no tiene. Haga pull primero y después push.
  network: No se pudo conectar con el remoto.
