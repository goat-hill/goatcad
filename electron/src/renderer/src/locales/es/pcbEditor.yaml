collision:
  title: Enrutador
  buttonTitle: Modo del enrutador
  explain:
    highlight: Deja todo en su sitio y marca las violaciones de holgura, pero no las coloca salvo que se permitan las violaciones de DRC.
  settingsTitle: Ajustes
  settings:
    allowViolations:
      name: Permitir violaciones de DRC
      note: Coloca la pista incluso a través de las violaciones de holgura que marca Resaltar.
    freeAngle:
      name: Modo de ángulo libre
      note: Las pistas van rectas hasta el cursor con cualquier ángulo.
    shoveVias:
      name: Empujar vías
    jumpOverObstacles:
      name: Saltar sobre los obstáculos
      note: Las pistas empujadas que encuentran un pad lo rodean por detrás en lugar de frenar el enrutado.
    removeLoops:
      name: Eliminar pistas redundantes
      note: Una pista nueva que une lo que ya une una antigua la sustituye.
    smartPads:
      name: Optimizar conexiones de pads
      note: Las pistas salen y entran en los pads por su salida más limpia, nunca con un ángulo extraño.
    smoothDragged:
      name: Suavizar segmentos arrastrados
      note: Un segmento arrastrado se alinea con sus vecinos, y una esquina con el punto donde se encuentran.
    optimizeDragged:
      name: Optimizar toda la pista arrastrada
      note: Se ordena toda la pista arrastrada, no solo la parte que movió el arrastre.
    autoPosture:
      name: Usar el recorrido del ratón para fijar la postura
      note: Que una pista empiece en diagonal o recta depende de cómo sale el ratón del clic.
    startDiagonal:
      name: Empezar en diagonal
      note: Sin el recorrido del ratón, las pistas empiezan con la diagonal; / la invierte.
    fixAllSegments:
      name: Fijar todos los segmentos al hacer clic
      note: Un clic tiende toda la pista hasta el cursor. Desactivado, el último segmento queda libre.
